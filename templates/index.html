<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
  <div class="landing">
    <div class="landing-hero">
      <div class="landing-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </div>
      <h1>Beam</h1>
      <p class="lede">Send photos, videos and files from your phone to this computer instantly. Pick a side to get started.</p>

      <div class="choice-grid">
        <a class="choice-card send" href="{{ url_for('send_page') }}">
          <div class="choice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/><circle cx="12" cy="9" r="3.2"/></svg>
          </div>
          <h2>Sender</h2>
          <p class="choice-desc">Open this on your phone. Take a photo or pick files to beam over.</p>
        </a>

        <a class="choice-card receive" href="{{ url_for('receive_page') }}">
          <div class="choice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <h2>Receiver</h2>
          <p class="choice-desc">Open this on your laptop. Watch everything arrive live.</p>
        </a>
      </div>
    </div>
    <div class="landing-footer">Both devices need to be on the same Wi-Fi network</div>
  </div>
</body>
</html>
