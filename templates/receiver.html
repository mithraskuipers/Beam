<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beam · Receive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/receiver.css') }}">
</head>
<body>

  <div class="topbar">
    <a class="brand" href="{{ url_for('index') }}" style="text-decoration:none;">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Beam</span>
        <span class="brand-sub">Receiver</span>
      </div>
    </a>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </div>

  <div class="page">

    <div class="connect-panel" id="connectPanel" hidden>
      <div class="connect-qr"><img id="qrImg" alt="QR code to open the send page"></div>
      <div class="connect-text">
        <strong>Scan to open the send page on another device</strong>
        <span>Or open <code id="senderUrl">…</code> on the same network</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <h1>Received</h1>
        <span class="item-count" id="itemCount">0 items</span>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost btn-sm" id="toggleSelectBtn" type="button">Select</button>
        <button class="btn btn-ghost btn-sm" id="toggleConnectBtn" type="button">Add device</button>
        <button class="btn btn-ghost btn-sm" id="downloadAllBtn" type="button">Download all</button>
        <button class="btn btn-danger btn-sm" id="clearAllBtn" type="button">Clear all</button>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </div>
      <strong>Waiting for something to arrive</strong>
      <span>Open the Send page on another device and beam over a photo, video or file.</span>
    </div>

    <div class="gallery" id="gallery"></div>

  </div>

  <div class="selection-bar" id="selectionBar">
    <span class="sel-count" id="selCount">0 selected</span>
    <button class="btn btn-primary" id="selDownloadBtn" type="button">Download zip</button>
    <button class="btn btn-danger" id="selDeleteBtn" type="button">Delete</button>
    <button class="btn btn-ghost" id="selCancelBtn" type="button">Cancel</button>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-topbar">
      <span class="lightbox-title" id="lightboxTitle"></span>
      <div class="lightbox-actions">
        <button id="lightboxCopyBtn" type="button" aria-label="Copy to clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button id="lightboxDownloadBtn" type="button" aria-label="Download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button id="lightboxCloseBtn" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <button class="lightbox-nav prev" id="lightboxPrev" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="lightbox-stage" id="lightboxStage"></div>
    <button class="lightbox-nav next" id="lightboxNext" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/receiver.js') }}"></script>
</body>
</html>
