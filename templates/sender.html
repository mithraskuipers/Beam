<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beam · Send</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/sender.css') }}">
</head>
<body>

  <div class="topbar">
    <a class="brand" href="{{ url_for('index') }}" style="text-decoration:none;">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Beam</span>
        <span class="brand-sub">Sender</span>
      </div>
    </a>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </div>

  <div class="page">

    <div class="camera-panel" id="cameraPanel">
      <div class="camera-idle" id="cameraIdle">
        <button class="camera-mode-btn" id="photoModeBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4h5l1.5 2H19a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Take Photo</span>
        </button>
        <button class="camera-mode-btn" id="videoModeBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
          <span>Record Video</span>
        </button>
        <span class="camera-idle-note" id="cameraIdleNote" hidden>Camera unavailable. You can still send files below.</span>
      </div>

      <video id="cameraVideo" autoplay playsinline muted hidden></video>
      <div class="camera-flash" id="cameraFlash"></div>
      <div class="rec-indicator" id="recIndicator" hidden>
        <span class="rec-dot"></span><span id="recTimer">0:00</span>
      </div>

      <div class="camera-controls" id="cameraControls" hidden>
        <div class="camera-controls-inner">
          <button class="flip-btn" id="flipBtn" aria-label="Switch camera" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1 21 6l-4 3.9"/><path d="M3 12v-1a4 4 0 0 1 4-4h14"/><path d="M7 21.9 3 18l4-3.9"/><path d="M21 12v1a4 4 0 0 1-4 4H3"/></svg>
          </button>
          <button class="shutter-btn" id="shutterBtn" aria-label="Capture" type="button">
            <span class="shutter-inner"></span>
          </button>
          <button class="close-cam-btn" id="closeCamBtn" aria-label="Cancel" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="or-divider">or send from your device</div>

    <div class="dropzone" id="dropzone" role="button" tabindex="0">
      <div class="dropzone-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8"/><path d="M12 3v12"/></svg>
      </div>
      <div class="dropzone-text">
        <strong>Choose photos, videos or files</strong>
        <span>Tap to browse, or drag files here</span>
      </div>
    </div>
    <input type="file" id="fileInput" multiple>

    <div id="queueSection" hidden>
      <div class="section-title">Sending</div>
      <div class="queue" id="queue"></div>
    </div>

  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/sender.js') }}"></script>
</body>
</html>
