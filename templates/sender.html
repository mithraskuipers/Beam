<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beam · Send</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/sender.css') }}">
</head>
<body>

  <div class="topbar">
    <a class="brand" href="{{ url_for('index') }}" style="text-decoration:none;">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Beam</span>
        <span class="brand-sub">Sender</span>
      </div>
    </a>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </div>

  <div class="page">

    <div class="dropzone" id="dropzone" role="button" tabindex="0">
      <div class="dropzone-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8"/><path d="M12 3v12"/></svg>
      </div>
      <div class="dropzone-text">
        <strong>Choose files to send</strong>
        <span>Click to browse, or drag files here</span>
      </div>
    </div>
    <input type="file" id="fileInput" multiple>

    <div id="queueSection" hidden>
      <div class="section-title">Sending</div>
      <div class="queue" id="queue"></div>
    </div>

  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/sender.js') }}"></script>
</body>
</html>
